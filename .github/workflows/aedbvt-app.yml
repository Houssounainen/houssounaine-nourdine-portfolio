name: AEDBVT App CI

on:
  pull_request:
    paths:
      - "aedbvt-app/**"
      - "vercel.json"
      - "scripts/vercel-ignore-build.sh"
      - ".github/workflows/aedbvt-app.yml"
  push:
    branches: [main]
    paths:
      - "aedbvt-app/**"
      - "vercel.json"
      - "scripts/vercel-ignore-build.sh"
      - ".github/workflows/aedbvt-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aedbvt-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=critical
      - run: node scripts/check-sql.mjs
      - name: Validate Vercel config
        run: |
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('../vercel.json','utf8')); const cmd=j.ignoreCommand||''; if(cmd.length>256){console.error('ignoreCommand too long:',cmd.length); process.exit(1)}"
          bash -n ../scripts/vercel-ignore-build.sh
      - run: node scripts/check-pwa.mjs
      - run: node scripts/check-android.mjs
      - run: node scripts/check-access.mjs
      - run: node scripts/check-dues.mjs
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
