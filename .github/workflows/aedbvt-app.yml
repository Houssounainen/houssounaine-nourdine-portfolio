name: AEDBVT App CI

on:
  pull_request:
    paths:
      - "aedbvt-app/**"
      - ".github/workflows/aedbvt-app.yml"
  push:
    branches: [main]
    paths:
      - "aedbvt-app/**"
      - ".github/workflows/aedbvt-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aedbvt-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=critical\n      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
